version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: aqua-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST_AUTH_METHOD=${POSTGRES_HOST_AUTH_METHOD} 
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - aqua-network

  postgres-init:
    image: postgres:16-alpine
    container_name: aqua-postgres-init
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - aqua-network
    command: >
      bash -c "
      export PGPASSWORD=${POSTGRES_PASSWORD};
      for db in telemetry_db device_db control_db identity_db notification_db firmware_db; do
        psql -h postgres -U ${POSTGRES_USER} -tc \"SELECT 1 FROM pg_database WHERE datname = '$$db'\" | grep -q 1 || psql -h postgres -U ${POSTGRES_USER} -c \"CREATE DATABASE $$db\";
      done
      "

  redis:
    image: redis:7.2-alpine
    container_name: aqua-redis
    command: redis-server --save 60 1 --loglevel warning --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aqua-network

  rabbitmq:
    image: heidiks/rabbitmq-delayed-message-exchange:3.13-management-alpine
    container_name: aqua-rabbitmq
    ports:
      - "5672:5672"  
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    networks:
      - aqua-network

  minio:
    image: minio/minio
    container_name: aqua-minio
    ports:
      - "9000:9000" 
      - "9001:9001" 
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aqua-network

  minio-setup:
    image: minio/mc
    container_name: aqua-minio-setup
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - aqua-network
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc config host add myminio http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
      /usr/bin/mc mb myminio/${MINIO_BUCKET_NAME} --ignore-existing;
      /usr/bin/mc policy download myminio/${MINIO_BUCKET_NAME};
      exit 0;
      "

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: aqua-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false 
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m" 
    ports:
      - "9200:9200"
    networks:
      - aqua-network

  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.4
    container_name: aqua-kibana
    profiles: ["observability"]
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch
    networks:
      - aqua-network

  api-gateway:
    container_name: api-gateway
    build:
      context: .
      dockerfile: src/Gateway/ApiGateway/Dockerfile
    ports:
      - "5055:8080"
    depends_on:
      - telemetry-api
      - device-api
      - control-api
      - identity-api
      - notification-api
      - firmware-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - JwtOptions__SecretKey=${JWT_SECRET_KEY}
      - JwtOptions__Issuer=${JWT_ISSUER}
      - JwtOptions__Audience=${JWT_AUDIENCE}
      - JwtOptions__ExpiresHours=${JWT_EXPIRES_HOURS}
    networks:
      - aqua-network

  identity-api:
    container_name: identity-api
    build:
      context: .
      dockerfile: src/Services/IdentityService/IdentityService/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__IdentityDbContext=Host=postgres;Database=identity_db;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - ConnectionStrings__Redis=redis:6379
      - JwtOptions__SecretKey=${JWT_SECRET_KEY}
      - JwtOptions__Issuer=${JWT_ISSUER}
      - JwtOptions__Audience=${JWT_AUDIENCE}
      - JwtOptions__ExpiresHours=${JWT_EXPIRES_HOURS}
      - RabbitMqOptions__Host=amqp://rabbitmq:5672
      - RabbitMqOptions__UserName=${RABBITMQ_DEFAULT_USER}
      - RabbitMqOptions__Password=${RABBITMQ_DEFAULT_PASS}
    depends_on:
      postgres-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy 
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - aqua-network

  device-api:
    container_name: device-api
    build:
      context: . 
      dockerfile: src/Services/DeviceService/DeviceService/Dockerfile
    depends_on:
      postgres-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy 
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DeviceDbContext=Host=postgres;Database=device_db;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - ConnectionStrings__Redis=redis:6379 
      - RabbitMqOptions__Host=amqp://rabbitmq:5672
      - RabbitMqOptions__UserName=${RABBITMQ_DEFAULT_USER}
      - RabbitMqOptions__Password=${RABBITMQ_DEFAULT_PASS}
      - JwtOptions__SecretKey=${JWT_SECRET_KEY}
      - JwtOptions__Issuer=${JWT_ISSUER}
      - JwtOptions__Audience=${JWT_AUDIENCE}
      - JwtOptions__ExpiresHours=${JWT_EXPIRES_HOURS}
      - GrpcConfiguration__DeviceServiceUrl=http://device-api:50051
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - aqua-network

  control-api:
    container_name: control-api
    build:
      context: . 
      dockerfile: src/Services/ControlService/ControlService/Dockerfile
    depends_on:
      postgres-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy 
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__ControlDbContext=Host=postgres;Database=control_db;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - ConnectionStrings__Redis=redis:6379 
      - RabbitMqOptions__Host=amqp://rabbitmq:5672
      - RabbitMqOptions__UserName=${RABBITMQ_DEFAULT_USER}
      - RabbitMqOptions__Password=${RABBITMQ_DEFAULT_PASS}
      - JwtOptions__SecretKey=${JWT_SECRET_KEY}
      - JwtOptions__Issuer=${JWT_ISSUER}
      - JwtOptions__Audience=${JWT_AUDIENCE}
      - JwtOptions__ExpiresHours=${JWT_EXPIRES_HOURS}
      - GrpcConfiguration__DeviceServiceUrl=http://device-api:50051
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - aqua-network

  telemetry-api:
    container_name: telemetry-api
    build:
      context: . 
      dockerfile: src/Services/TelemetryService/TelemetryService/Dockerfile
    depends_on:
      postgres-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy 
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080  
      - ConnectionStrings__TelemetryDbContext=Host=postgres;Database=telemetry_db;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - ConnectionStrings__Redis=redis:6379 
      - RabbitMqOptions__Host=amqp://rabbitmq:5672
      - RabbitMqOptions__UserName=${RABBITMQ_DEFAULT_USER}
      - RabbitMqOptions__Password=${RABBITMQ_DEFAULT_PASS}
      - JwtOptions__SecretKey=${JWT_SECRET_KEY}
      - JwtOptions__Issuer=${JWT_ISSUER}
      - JwtOptions__Audience=${JWT_AUDIENCE}
      - JwtOptions__ExpiresHours=${JWT_EXPIRES_HOURS}
      - GrpcConfiguration__DeviceServiceUrl=http://device-api:50051
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - aqua-network

  notification-api:
    container_name: notification-api
    build:
      context: .
      dockerfile: src/Services/NotificationService/NotificationService/Dockerfile
    depends_on:
      postgres-init: 
        condition: service_completed_successfully
      rabbitmq: 
        condition: service_healthy 
      redis:
        condition: service_healthy 
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=1 
      - ConnectionStrings__NotificationDbContext=Host=postgres;Database=notification_db;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - ConnectionStrings__Redis=redis:6379
      - RabbitMqOptions__Host=amqp://rabbitmq:5672
      - RabbitMqOptions__UserName=${RABBITMQ_DEFAULT_USER}
      - RabbitMqOptions__Password=${RABBITMQ_DEFAULT_PASS}
      - JwtOptions__SecretKey=${JWT_SECRET_KEY}
      - JwtOptions__Issuer=${JWT_ISSUER}
      - JwtOptions__Audience=${JWT_AUDIENCE}
      - JwtOptions__ExpiresHours=${JWT_EXPIRES_HOURS}
      - TelegramOptions__BotToken=${TELEGRAM_BOT_TOKEN}
      - EmailOptions__Host=${EMAIL_HOST}
      - EmailOptions__Port=${EMAIL_PORT}
      - EmailOptions__UserName=${EMAIL_USERNAME}
      - EmailOptions__Password=${EMAIL_PASSWORD}
      - EmailOptions__FromEmail=${EMAIL_FROM}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - aqua-network

  firmware-migrations:
    image: migrate/migrate
    container_name: firmware-migrations
    depends_on:
      postgres-init:
        condition: service_completed_successfully
    volumes:
      - ./src/Services/FirmwareService/migrations:/migrations
    command: -path /migrations -database postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/firmware_db?sslmode=disable up
    networks:
      - aqua-network

  firmware-api:
    container_name: firmware-api
    build:
      context: ./src/Services/FirmwareService/.
      dockerfile: Dockerfile
    depends_on:
      firmware-migrations:
        condition: service_completed_successfully 
      minio:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/firmware_db?sslmode=disable
      - S3_BUCKET_NAME=${MINIO_BUCKET_NAME}
      - AWS_REGION=${AWS_REGION}
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD}
      - AWS_ENDPOINT_URL=http://minio:9000 
    ports:
      - "5238:8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - aqua-network

networks:
  aqua-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  minio-data: