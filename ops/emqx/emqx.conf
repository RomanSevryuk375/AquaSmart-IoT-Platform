node {
  name = "emqx@127.0.0.1"
  cookie = "emqxsecretcookie"
  data_dir = "data"
}

cluster {
  name = emqxcl
  discovery_strategy = manual
}

dashboard {
  listeners {
    http.bind = 18083
  }
}

authentication = [
  {
    mechanism = password_based
    backend = http
    enable = true
    method = post
    url = "http://device-api:8080/internal/mqtt/auth"
    headers {
      "content-type" = "application/json"
      "x-internal-api-key" = "__MQTT_WEBHOOK_SECRET__"
    }
    body {
      username = "${username}"
      password = "${password}"
      clientid = "${clientid}"
    }
    pool_size = 8
    connect_timeout = "5s"
    request_timeout = "5s"
    enable_pipelining = 100
  }
]

authorization {
  no_match = deny
  deny_action = disconnect
  cache {
    enable = false
  }
  sources = [
    {
      type = http
      enable = true
      method = post
      url = "http://device-api:8080/internal/mqtt/acl"
      headers {
        "content-type" = "application/json"
        "x-internal-api-key" = "__MQTT_WEBHOOK_SECRET__"
      }
      body {
        username = "${username}"
        topic = "${topic}"
        action = "${action}"
      }
      pool_size = 8
      connect_timeout = "5s"
      request_timeout = "5s"
      enable_pipelining = 100
    }
  ]
}
